<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G1-C production隔离验收</title><link rel="stylesheet" href="../src/combat-stage4.css"><link rel="stylesheet" href="../src/combat-visual-refit.css"><link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="../src/workshop-responsive.css"><link rel="stylesheet" href="../src/settlement-ui/styles.css"><link rel="stylesheet" href="../src/settlement-live.css"><style>#combat.real-combat-root{position:relative;inset:auto;z-index:auto;min-height:0}body{margin:0;background:#100e10;color:#eee;font:16px/1.6 system-ui}header,section.qa{padding:16px;max-width:1000px;margin:auto}button,select,input{font:inherit;max-width:100%}button{background:#30151a;color:#fff;border:1px solid #a65764;padding:8px;margin:4px}details{padding:8px;border-bottom:1px solid #654}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<header><h1>G1-C · 隔离回放验收</h1><p>人工测试持有与类型化参与者，执行production能力、主战斗引擎及既有技能卡。三只鬼普通获取待开发；不是正式关卡可达或新档通关。</p><select id="fixture"></select><button id="load">加载隔离样本</button><button id="export">导出测试状态</button><label>导入测试副本<input id="test-import" type="file" accept=".json"></label><p id="error" role="status"></p></header><section class="qa" id="research"></section><section id="workshop" class="qa"></section><div id="result"></div><div id="combat" class="real-combat-root"></div><section class="qa"><details><summary>原始结算状态</summary><pre id="snapshot"></pre></details></section>
<script type="module">
import {act,available,validate,upgrade} from '../src/engine.js';
import {mountCombatUI} from '../src/combat-stage4-ui.js';import {buildRealCombatData} from '../src/combat-stage4-adapter.js';import {g1cView} from '../src/g1c-view.js';import {g1cLabel} from '../src/g1c-production.js';import {workshopView} from '../src/rpg-workshop.js';import {currentSettlement} from '../src/settlement-controller.js';import {mountSettlement} from '../src/settlement-ui/SettlementView.mjs';
const fixtures=await(await fetch('./g1c-states.json')).json(),key='G1C-PRODUCTION:state',labelKey='G1C-PRODUCTION:fixture';let s,c,ui;
const select=document.querySelector('#fixture');for(const k of Object.keys(fixtures)){const o=document.createElement('option');o.value=k;o.textContent=k;select.append(o);}
function persist(){localStorage.setItem(key,JSON.stringify(s));localStorage.setItem(labelKey,select.value);}
function render(){document.querySelector('#workshop').innerHTML=workshopView(s,available(s,c),g1cLabel).replaceAll('src="assets/','src="../assets/');const record=currentSettlement(s);document.querySelector('#result').innerHTML='';if(record)mountSettlement(document.querySelector('#result'),{initialData:record,assetBaseUrl:'../assets/settlement-ui',onReturnToMap:()=>{}});document.querySelector('#research').innerHTML=g1cView(s,available(s,c))+(!s.combat?available(s,c).filter(a=>a==='rest'||a==='suppress'||a==='death:commit'||a.startsWith('reaction:')).map(a=>`<button data-action="${a}">${a}</button>`).join(''):'');document.querySelector('#snapshot').textContent=JSON.stringify(s,null,2);ui?.destroy();ui=null;document.querySelector('#combat').innerHTML='';if(s.combat)ui=mountCombatUI(document.querySelector('#combat'),{mode:'live',initialData:buildRealCombatData(s,c),onAction:commit,onRetreat:()=>commit('combat:retreat')});}
function commit(v){const a=typeof v==='string'?v:v.skillId,n=act(s,a,c);if(n===s){document.querySelector('#error').textContent='非法预检，零成本拒绝。';return;}if(!validate(n,c))throw Error('G1C production validation '+a);s=n;persist();render();}
document.addEventListener('click',e=>{if(e.target.closest('[data-g1a-open]'))document.querySelector('.g1a-dialog')?.showModal();if(e.target.closest('[data-g1a-close]'))document.querySelector('.g1a-dialog')?.close();const a=e.target.closest('[data-action]')?.dataset.action;if(a)commit(a);});
document.querySelector('#load').onclick=()=>{s=structuredClone(fixtures[select.value].state);c=structuredClone(fixtures[select.value].context);if(!validate(s,c))throw Error('invalid test fixture');persist();render();};
document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='G1C-ISOLATED-ONLY.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.querySelector('#test-import').onchange=async e=>{const n=upgrade(JSON.parse(await e.target.files[0].text()));if(!validate(n,c)){document.querySelector('#error').textContent='拒绝无效测试副本，原状态保留。';return;}s=n;persist();render();};
const saved=localStorage.getItem(key),label=localStorage.getItem(labelKey);if(saved&&fixtures[label]){select.value=label;c=structuredClone(fixtures[label].context);s=upgrade(JSON.parse(saved));if(!validate(s,c))throw Error('invalid saved test holder');render();}else document.querySelector('#load').click();
</script></html>
