<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>同步共鸣 · 宏大共鸣图谱 · 第四步数据接线</title><link rel="stylesheet" href="./rework.css"><link rel="stylesheet" href="../src/published-sidebar.css" data-published-sidebar></head>
<body><div class="app-shell">
<header class="page-top">
 <div class="brand"><img src="assets/approved/brand.svg" alt="神秘复苏 RPG · 诡异世界，规则之内"></div>
 <div class="page-actions"><label class="search-wrap"><span>⌕</span><input id="search" placeholder="搜索共鸣名称、参与的厉鬼…" aria-label="搜索共鸣与厉鬼"></label><select id="type-filter" aria-label="筛选关系类型"><option value="all">全部类型</option><option value="resonance">共鸣连接</option><option value="conflict">冲突关系</option><option value="clue">未知线索</option></select><select id="status-filter" aria-label="筛选状态"><option value="all">全部状态</option><option value="core">核心</option><option value="participating">已启用</option><option value="available">未启用</option><option value="conflict">冲突</option><option value="research">研究中</option><option value="locked">未解锁</option></select><button id="return-game" aria-label="返回游戏">返回</button><button id="reset-all" title="重置筛选与视图" aria-label="重置全部">↻</button></div>
 <div class="header-note"><b>血色的联系，是这个世界最真实的规则。</b><span>第四步 · 当前游戏存档 · 能力未自动解锁</span></div>
</header>
<aside class="game-menu" aria-label="游戏功能导航"><div class="profile"><img src="assets/approved/avatar.svg" alt="批准原图角色裁片"><div><b id="live-player-name">当前玩家</b><small>当前玩家</small><span>同步共鸣图谱</span></div></div><nav aria-label="独立预览导航"><div class="nav-item"><img src="assets/approved/nav-home.svg" alt="主页"></div><div class="nav-item"><img src="assets/approved/nav-drive.svg" alt="驾驭厉鬼"></div><div class="nav-item"><img src="assets/approved/nav-backpack.svg" alt="拼图背包"></div><div class="nav-item"><img src="assets/approved/nav-codex.svg" alt="厉鬼图鉴"></div><div class="nav-item active" aria-current="page"><img src="assets/approved/nav-sync.svg" alt="同步共鸣"></div><div class="nav-item"><img src="assets/approved/nav-record.svg" alt="档案记录"></div><div class="nav-item"><img src="assets/approved/nav-map.svg" alt="地图探索"></div><div class="nav-item"><img src="assets/approved/nav-settings.svg" alt="系统设置"></div></nav><div class="side-motto"><img src="assets/approved/motto.svg" alt="人死不灭，厉鬼可用"></div><div class="side-note">本页仅预览同步共鸣组件</div></aside>
<main class="workspace"><section class="main-layout">
 <aside class="collection ornate"><div class="panel-header"><h2><img class="approved-heading" src="assets/approved/heading-collection.svg" alt="已驾驭厉鬼"></h2><span id="ghost-count"></span></div><label class="list-search"><span>⌕</span><input id="list-search" aria-label="搜索厉鬼列表" placeholder="搜索厉鬼…"></label><div id="quick-filters" class="quick-filters" role="group" aria-label="厉鬼状态分类"><button data-filter="all" class="active">全部</button><button data-filter="core">核心</button><button data-filter="participating">已参与</button><button data-filter="available">可接入</button><button data-filter="conflict">冲突</button><button data-filter="locked">未解锁</button></div><div id="ghost-list" class="ghost-list" aria-label="厉鬼选择列表"></div><div class="panel-footer">持有清单 · 评级：神灵异 / S / A / B / C / D</div></aside>
 <section class="network-section ornate" aria-label="可交互共鸣图谱"><div class="network-header"><h2><img class="approved-heading" src="assets/approved/heading-network.svg" alt="共鸣图谱"></h2><div class="network-subtitle">以我为核，万鬼相引。<br><small>那些交织的关系，构成了通往更高之处的道路。</small></div><button id="fit-map" title="适应全部节点">↻ 全图</button></div><div id="graph-viewport" class="graph-viewport"><div class="legend"><span><i class="key resonance"></i>已有关联</span><span><i class="key conflict"></i>已观察冲突</span><span><i class="key clue"></i>未验证关系</span></div><svg id="resonance-graph" viewBox="0 0 800 660" aria-label="可缩放的厉鬼共鸣关系图谱"><defs><radialGradient id="red-aura"><stop stop-color="#f60023" stop-opacity=".3"/><stop offset="1" stop-color="#ed0023" stop-opacity="0"/></radialGradient><filter id="red-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="graph-content"></g></svg><div id="edge-choice" class="edge-choice" hidden aria-label="交叉处关系选择"></div><select id="mobile-node" aria-label="定位并放大厉鬼节点"></select><button id="browse-mode" class="browse-mode">全图定位</button><svg id="mini-map" aria-label="全图定位器" role="img" viewBox="0 0 800 660"></svg><div id="branch-banner" class="branch-banner" hidden></div><div class="map-toolbar"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-level">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="pan-mode" aria-label="切换拖拽图谱" aria-pressed="false">拖拽</button><button id="center-player" aria-label="回到角色">核心</button><button id="layout-reset" aria-label="恢复节点布局">复位</button></div><div class="graph-hint">拖拽浏览 · 滚轮 / 双指缩放 · 交叉处可选关系</div></div></section>
 <aside class="details ornate"><div class="panel-header"><h2><img class="approved-heading" src="assets/approved/heading-details.svg" alt="共鸣详情"></h2><span class="demo-tag">当前存档</span></div><div id="detail-area" class="detail-area"></div><div class="details-footer"><button id="view-neighbors">聚焦相连分支</button><button id="clear-selection">查看全图</button></div></aside>
</section><section class="family-section ornate"><div class="family-header"><h2><img class="approved-heading" src="assets/approved/heading-family.svg" alt="共鸣关系总览"></h2><span id="family-meta"></span><div id="family-filters"><button data-family-filter="all" class="active">全部谱系</button><button data-family-filter="resonance">共鸣</button><button data-family-filter="conflict">冲突</button><button data-family-filter="clue">未知线索</button></div></div><div id="families" class="families" aria-label="共鸣谱系筛选"></div></section><footer class="legal-notice">第四步接线 · 显示实际持有与已观察关系；关系结构不是新的共鸣能力。选择、筛选、缩放不推进世界。</footer></main>
</div><script type="module" src="./rework.js"></script></body></html>
