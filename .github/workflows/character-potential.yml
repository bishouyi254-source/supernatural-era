name: Character potential candidate
on:
  push:
    branches: [feature/character-potential-death-loop]
  pull_request:
    paths:
      - 'src/character-potential*'
      - 'src/engine.js'
      - 'src/progression.js'
      - 'src/combat.js'
      - 'src/app.js'
      - 'tests/character-potential.test.mjs'
      - '.github/workflows/character-potential.yml'
jobs:
  character-potential:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/character-potential.js
          node --check src/character-potential-ui.js
          node --check src/engine.js
          node --check src/progression.js
          node --check src/combat.js
          node --check src/app.js
      - name: Character and death regression tests
        run: node --test tests/character-potential.test.mjs
      - name: Install isolated browser harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke on two viewports
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/character-http.log 2>&1 &
          node tests/character-potential.browser.mjs 2>&1 | tee candidate-artifacts/browser-smoke.log
      - name: Report candidate browser failure in draft PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f candidate-artifacts/browser-smoke.log ]; then
            { echo "### Browser smoke blocker (automated candidate evidence)"; echo '~~~'; tail -n 40 candidate-artifacts/browser-smoke.log; echo '~~~'; } > /tmp/character-smoke-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/character-smoke-comment.md
          fi
      - name: Upload candidate browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-potential-browser-evidence
          path: candidate-artifacts/
          if-no-files-found: ignore

